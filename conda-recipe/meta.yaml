{% set name = "gcnvplot" %}
{% set version = "1.1.1" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  path: ..

build:
  number: 0
  noarch: python
  script: {{ PYTHON }} -m pip install . --no-deps --ignore-installed -vv

requirements:
  host:
    - python >=3.10
    - pip
    - setuptools >=77
    - wheel
  run:
    - python >=3.10

test:
  imports:
    - gcnvplot
  commands:
    - gcnvplot --help
    - gcnvplot create-background --help
    - gcnvplot index-gtf --help
    - gcnvplot plot --help
    - gcnvplot report --help

about:
  home: https://github.com/MOMA-AUH/gcnvplot
  summary: Command-line tools for plotting and reporting GATK germline CNV results
  license: MIT
  license_file: LICENSE
